name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: end-to-end con finti S3
        run: ./scripts/local-e2e.sh
      - name: azioni del pannello sulla cache (svuota, precarica)
        run: ./scripts/panel-e2e.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Tipi e build del pannello
        run: npm run build
        working-directory: web

  acme:
    # certificati automatici contro Pebble, il server ACME di test di Let's Encrypt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Nome di prova verso questa macchina
        run: echo "127.0.0.1 acme-test.example.com" | sudo tee -a /etc/hosts
      - name: Avvio di Pebble
        run: |
          docker run -d --name pebble --network host \
            -e PEBBLE_VA_NOSLEEP=1 \
            ghcr.io/letsencrypt/pebble:latest \
            -config /test/config/pebble-config.json -strict=false
          docker cp pebble:/test/certs/pebble.minica.pem "$RUNNER_TEMP/pebble.minica.pem"
          for i in $(seq 30); do curl -sk https://localhost:14000/dir >/dev/null && break; sleep 1; done
          curl -sk https://localhost:14000/dir
      - name: Emissione e servizio del certificato
        run: PEBBLE_ROOT="$RUNNER_TEMP/pebble.minica.pem" ./scripts/acme-pebble.sh
      - name: Log di Pebble
        if: failure()
        run: docker logs pebble | tail -60

  update:
    # auto-aggiornamento con un finto GitHub e pacchetti firmati con una chiave di prova
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/next"
      - name: Aggiornamento, rifiuti e rollback
        run: ./scripts/update-e2e.sh
