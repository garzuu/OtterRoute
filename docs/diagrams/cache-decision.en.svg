<svg class="dg" viewBox="0 0 900 370" role="img" aria-labelledby="t-cache-decision" xmlns="http://www.w3.org/2000/svg"><title id="t-cache-decision">What the cache decides for every request</title><defs><marker id="a-cache-decision" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker></defs><rect x="10" y="165" width="140" height="64" rx="10" class="dg-soft"/><text x="80.0" y="193.0" class="dg-t" text-anchor="middle">Request</text><text x="80.0" y="211.0" class="dg-m" text-anchor="middle">GET or HEAD</text><rect x="190" y="30" width="180" height="56" rx="10" class="dg-good"/><text x="280.0" y="54.0" class="dg-t" text-anchor="middle">HIT</text><text x="280.0" y="72.0" class="dg-m" text-anchor="middle">answers immediately</text><rect x="190" y="150" width="180" height="94" rx="10" class="dg-brand2"/><text x="280.0" y="193.0" class="dg-t" text-anchor="middle">Fresh copy?</text><text x="280.0" y="211.0" class="dg-m" text-anchor="middle">in cache and not expired</text><rect x="420" y="165" width="150" height="64" rx="10" class="dg-box"/><text x="495.0" y="193.0" class="dg-t" text-anchor="middle">Storage</text><text x="495.0" y="211.0" class="dg-m" text-anchor="middle">signed request</text><rect x="650" y="14" width="240" height="58" rx="10" class="dg-good"/><text x="770.0" y="39.0" class="dg-t" text-anchor="middle">MISS</text><text x="770.0" y="57.0" class="dg-m" text-anchor="middle">200 · downloads, saves and sends</text><path d="M570 197 L650 43" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><rect x="650" y="84" width="240" height="58" rx="10" class="dg-good"/><text x="770.0" y="109.0" class="dg-t" text-anchor="middle">REVALIDATED</text><text x="770.0" y="127.0" class="dg-m" text-anchor="middle">304 · the copy is still valid</text><path d="M570 197 L650 113" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><rect x="650" y="154" width="240" height="58" rx="10" class="dg-warn"/><text x="770.0" y="179.0" class="dg-t" text-anchor="middle">STALE</text><text x="770.0" y="197.0" class="dg-m" text-anchor="middle">storage down · expired copy</text><path d="M570 197 L650 183" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><rect x="650" y="224" width="240" height="58" rx="10" class="dg-warn"/><text x="770.0" y="249.0" class="dg-t" text-anchor="middle">404</text><text x="770.0" y="267.0" class="dg-m" text-anchor="middle">missing (remembered 60 s)</text><path d="M570 197 L650 253" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><rect x="650" y="294" width="240" height="58" rx="10" class="dg-bad"/><text x="770.0" y="319.0" class="dg-t" text-anchor="middle">502</text><text x="770.0" y="337.0" class="dg-m" text-anchor="middle">credentials or storage</text><path d="M570 197 L650 323" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><path d="M150 197 L190 197" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><path d="M280 150 L280 86" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><text x="300" y="124" class="dg-l" text-anchor="middle">yes</text><path d="M370 197 L420 197" class="dg-line" fill="none" marker-end="url(#a-cache-decision)"/><text x="395" y="186" class="dg-l" text-anchor="middle">no</text></svg>
