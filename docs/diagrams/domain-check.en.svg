<svg class="dg" viewBox="0 0 900 280" role="img" aria-labelledby="t-domain-check" xmlns="http://www.w3.org/2000/svg"><title id="t-domain-check">How a domain is verified</title><defs><marker id="a-domain-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker></defs><rect x="10" y="70" width="130" height="76" rx="10" class="dg-brand2"/><text x="75.0" y="104.0" class="dg-t" text-anchor="middle">Panel</text><text x="75.0" y="122.0" class="dg-m" text-anchor="middle">every 5 or 15 min</text><rect x="190" y="40" width="210" height="136" rx="10" class="dg-box"/><text x="295.0" y="95.0" class="dg-t" text-anchor="middle">1 · Does the domain resolve?</text><text x="295.0" y="113.0" class="dg-m" text-anchor="middle">A/AAAA records</text><text x="295.0" y="131.0" class="dg-m" text-anchor="middle">without /etc/hosts</text><rect x="450" y="40" width="240" height="136" rx="10" class="dg-box"/><text x="570.0" y="86.0" class="dg-t" text-anchor="middle">2 · Does the node answer?</text><text x="570.0" y="104.0" class="dg-m" text-anchor="middle">HTTP on port 80</text><text x="570.0" y="122.0" class="dg-m" text-anchor="middle">Host: the domain</text><text x="570.0" y="140.0" class="dg-m" text-anchor="middle">/.well-known/otterroute/check</text><rect x="740" y="70" width="150" height="76" rx="10" class="dg-good"/><text x="815.0" y="95.0" class="dg-t" text-anchor="middle">Verified</text><text x="815.0" y="113.0" class="dg-m" text-anchor="middle">valid proof:</text><text x="815.0" y="131.0" class="dg-m" text-anchor="middle">sha256(node:nonce)</text><rect x="190" y="206" width="210" height="56" rx="10" class="dg-bad"/><text x="295.0" y="230.0" class="dg-t" text-anchor="middle">DNS error</text><text x="295.0" y="248.0" class="dg-m" text-anchor="middle">no record found</text><rect x="450" y="206" width="240" height="56" rx="10" class="dg-bad"/><text x="570.0" y="230.0" class="dg-t" text-anchor="middle">Node unreachable</text><text x="570.0" y="248.0" class="dg-m" text-anchor="middle">no answer or another server</text><path d="M140 108 L190 108" class="dg-line" fill="none" marker-end="url(#a-domain-check)"/><path d="M400 108 L450 108" class="dg-line" fill="none" marker-end="url(#a-domain-check)"/><path d="M690 108 L740 108" class="dg-line" fill="none" marker-end="url(#a-domain-check)"/><path d="M295 176 L295 206" class="dg-line" fill="none" marker-end="url(#a-domain-check)"/><path d="M570 176 L570 206" class="dg-line" fill="none" marker-end="url(#a-domain-check)"/></svg>
