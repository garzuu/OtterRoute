<svg class="dg" viewBox="0 0 900 330" role="img" aria-labelledby="t-https-acme" xmlns="http://www.w3.org/2000/svg"><title id="t-https-acme">Automatic HTTPS with ACME (HTTP-01 challenge)</title><defs><marker id="a-https-acme" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker></defs><rect x="10" y="96" width="140" height="76" rx="10" class="dg-soft"/><text x="80.0" y="130.0" class="dg-t" text-anchor="middle">Browser</text><text x="80.0" y="148.0" class="dg-m" text-anchor="middle">asks for the domain</text><rect x="250" y="20" width="270" height="260" rx="14" class="dg-brand"/><text x="266" y="44" class="dg-h" text-anchor="start">OtterRoute node</text><rect x="270" y="54" width="230" height="62" rx="10" class="dg-brand2"/><text x="385.0" y="81.0" class="dg-t" text-anchor="middle">HTTPS · port 443</text><text x="385.0" y="99.0" class="dg-m" text-anchor="middle">certificate chosen by name (SNI)</text><rect x="270" y="130" width="230" height="62" rx="10" class="dg-brand2"/><text x="385.0" y="157.0" class="dg-t" text-anchor="middle">HTTP · port 80</text><text x="385.0" y="175.0" class="dg-m" text-anchor="middle">answers the challenge</text><rect x="270" y="214" width="230" height="46" rx="10" class="dg-box"/><text x="385.0" y="242.0" class="dg-t" text-anchor="middle">certs/domain/ · key 0600</text><rect x="730" y="66" width="160" height="140" rx="10" class="dg-soft"/><text x="810.0" y="132.0" class="dg-t" text-anchor="middle">Let&#x27;s Encrypt</text><text x="810.0" y="150.0" class="dg-m" text-anchor="middle">ACME authority</text><path d="M150 85 L270 85" class="dg-line" fill="none" marker-end="url(#a-https-acme)"/><text x="210" y="74" class="dg-l" text-anchor="middle">HTTPS</text><path d="M520 100 L730 100" class="dg-line" fill="none" marker-end="url(#a-https-acme)"/><text x="625" y="88" class="dg-l" text-anchor="middle">1 · orders</text><path d="M730 150 L500 150" class="dg-line" fill="none" marker-end="url(#a-https-acme)"/><text x="625" y="138" class="dg-l" text-anchor="middle">2 · checks on :80</text><path d="M520 196 L730 196" class="dg-line" fill="none" marker-end="url(#a-https-acme)"/><text x="625" y="184" class="dg-l" text-anchor="middle">3 · downloads</text><text x="385" y="312" class="dg-m" text-anchor="middle">automatic renewal 30 days before expiry</text></svg>
