<svg class="dg" viewBox="0 0 900 300" role="img" aria-labelledby="t-request-flow" xmlns="http://www.w3.org/2000/svg"><title id="t-request-flow">Path of a request: visitor, route, cache, storage</title><defs><marker id="a-request-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker></defs><rect x="10" y="120" width="180" height="76" rx="10" class="dg-box"/><text x="100.0" y="154.0" class="dg-t" text-anchor="middle">Visitor</text><text x="100.0" y="172.0" class="dg-m" text-anchor="middle">browser or app</text><rect x="240" y="120" width="180" height="76" rx="10" class="dg-brand"/><text x="330.0" y="154.0" class="dg-t" text-anchor="middle">1 · Route</text><text x="330.0" y="172.0" class="dg-m" text-anchor="middle">longest prefix</text><rect x="470" y="120" width="180" height="76" rx="10" class="dg-brand"/><text x="560.0" y="154.0" class="dg-t" text-anchor="middle">2 · Disk cache</text><text x="560.0" y="172.0" class="dg-m" text-anchor="middle">fresh copy?</text><rect x="700" y="120" width="190" height="76" rx="10" class="dg-box"/><text x="795.0" y="154.0" class="dg-t" text-anchor="middle">3 · S3 storage</text><text x="795.0" y="172.0" class="dg-m" text-anchor="middle">signed request</text><path d="M190 158 L240 158" class="dg-line" fill="none" marker-end="url(#a-request-flow)"/><path d="M420 158 L470 158" class="dg-line" fill="none" marker-end="url(#a-request-flow)"/><path d="M650 158 L700 158" class="dg-line" fill="none" marker-end="url(#a-request-flow)"/><path d="M560 120 C560 40 100 40 100 120" class="dg-line" fill="none" marker-end="url(#a-request-flow)"/><text x="300" y="46" class="dg-l" text-anchor="middle">HIT · the cached copy answers immediately</text><path d="M795 196 C795 268 100 268 100 196" class="dg-line" fill="none" marker-end="url(#a-request-flow)"/><text x="450" y="282" class="dg-l" text-anchor="middle">MISS · the file reaches the visitor while it is saved</text></svg>
