.dg-h { fill: #3fb6c2; }
.dg-line { stroke: #a6a6b3; }
.dg-head { fill: #a6a6b3; }
}
</style><title id="t-architecture">Le parti del sistema</title><defs><marker id="a-architecture" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker></defs><rect x="240" y="20" width="440" height="320" rx="14" class="dg-brand"/><text x="256" y="44" class="dg-h" text-anchor="start">Nodo OtterRoute</text><rect x="260" y="60" width="190" height="70" rx="10" class="dg-brand2"/><text x="355.0" y="91.0" class="dg-t" text-anchor="middle">Gateway pubblico</text><text x="355.0" y="109.0" class="dg-m" text-anchor="middle">porta 80 · 443</text><rect x="470" y="60" width="190" height="70" rx="10" class="dg-brand2"/><text x="565.0" y="91.0" class="dg-t" text-anchor="middle">Pannello e API</text><text x="565.0" y="109.0" class="dg-m" text-anchor="middle">127.0.0.1:9090</text><rect x="260" y="160" width="190" height="60" rx="10" class="dg-box"/><text x="355.0" y="186.0" class="dg-t" text-anchor="middle">Cache</text><text x="355.0" y="204.0" class="dg-m" text-anchor="middle">su disco (LRU)</text><rect x="470" y="160" width="190" height="60" rx="10" class="dg-box"/><text x="565.0" y="186.0" class="dg-t" text-anchor="middle">Stato</text><text x="565.0" y="204.0" class="dg-m" text-anchor="middle">utenti, chiavi, config</text><rect x="260" y="250" width="190" height="60" rx="10" class="dg-box"/><text x="355.0" y="276.0" class="dg-t" text-anchor="middle">Guida offline</text><text x="355.0" y="294.0" class="dg-m" text-anchor="middle">/docs/ sul pannello</text><rect x="470" y="250" width="190" height="60" rx="10" class="dg-box"/><text x="565.0" y="276.0" class="dg-t" text-anchor="middle">Certificati e notifiche</text><text x="565.0" y="294.0" class="dg-m" text-anchor="middle">ACME · email · Telegram</text><rect x="10" y="30" width="180" height="50" rx="10" class="dg-soft"/><text x="100.0" y="60.0" class="dg-t" text-anchor="middle">Visitatori</text><rect x="10" y="110" width="180" height="50" rx="10" class="dg-soft"/><text x="100.0" y="140.0" class="dg-t" text-anchor="middle">Storage S3</text><rect x="730" y="30" width="160" height="50" rx="10" class="dg-soft"/><text x="810.0" y="60.0" class="dg-t" text-anchor="middle">Amministratori</text><rect x="730" y="110" width="160" height="50" rx="10" class="dg-soft"/><text x="810.0" y="140.0" class="dg-t" text-anchor="middle">Prometheus</text><rect x="730" y="240" width="160" height="70" rx="10" class="dg-soft"/><text x="810.0" y="262.0" class="dg-t" text-anchor="middle">Servizi esterni</text><text x="810.0" y="280.0" class="dg-m" text-anchor="middle">Let&#x27;s Encrypt,</text><text x="810.0" y="298.0" class="dg-m" text-anchor="middle">SMTP, Telegram</text><path d="M190 70 L260 70" class="dg-line" fill="none" marker-end="url(#a-architecture)"/><path d="M260 122 L190 122" class="dg-line" fill="none" marker-end="url(#a-architecture)"/><path d="M730 70 L660 70" class="dg-line" fill="none" marker-end="url(#a-architecture)"/><path d="M730 122 L660 122" class="dg-line" fill="none" marker-end="url(#a-architecture)"/><path d="M660 280 L730 280" class="dg-line" fill="none" marker-end="url(#a-architecture)"/></svg>
