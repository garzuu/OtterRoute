<svg class="dg" viewBox="0 0 900 360" role="img" aria-labelledby="t-architecture" xmlns="http://www.w3.org/2000/svg"><style>
svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
