# Nodo OtterRoute con pannello.
#   docker compose up -d --build
# Pannello (solo da questa macchina): http://127.0.0.1:9090/  ·  guida: /docs/
services:
  gateway:
    build: .
    environment:
      RUST_LOG: otterroute=info
    # porte standard: 80 HTTP pubblico, 9090 pannello solo da localhost
    ports: ["80:80", "127.0.0.1:9090:9090"]
    # l'utente del container non è root: gli serve poter usare la porta 80
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - gateway-data:/data

volumes:
  gateway-data:
